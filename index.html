<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="A clean, professional Hello, world! page.">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(91, 125, 255, .10), transparent 36%),
        radial-gradient(ellipse at 90% 90%, rgba(64, 184, 165, .09), transparent 32%),
        #f5f7fb;
    }

    main {
      width: min(100%, 720px);
      margin: auto 0;
      padding: clamp(36px, 8vw, 72px);
      text-align: center;
      background: rgba(255, 255, 255, .88);
      border: 1px solid #e7ebf3;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(31, 47, 82, .09);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: #586985;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      content: "";
      background: #35a98b;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(53, 169, 139, .12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.06;
      letter-spacing: -.055em;
    }

    h1 span { color: #526fe5; }

    .intro {
      max-width: 460px;
      margin: 20px auto 0;
      color: #65728a;
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.75;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 32px auto 0;
      background: linear-gradient(90deg, #526fe5, #46b59b);
      border-radius: 99px;
    }

    footer {
      flex: 0 0 auto;
      margin-top: 20px;
      color: #8994a8;
      font-size: .78rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 18px; }
      main { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A fresh start</p>
    <h1>Hello, <span>world!</span></h1>
    <p class="intro">A simple beginning, thoughtfully presented. Your next great idea starts here.</p>
    <div class="divider" aria-hidden="true"></div>
  </main>
  <footer>Made with care.</footer>
</body>
</html>
